[build]
builder = "nixpacks"
buildCommand = "cd frontend && npm install && npm run build && cd .. && python3 -m pip install -r requirements.txt && python3 -m alembic upgrade head"

[deploy]
startCommand = "python3 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
restartPolicyType = "on_failure"
